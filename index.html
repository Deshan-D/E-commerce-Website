<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <title>E-commerce product page</title>
  
  <link rel="stylesheet" href="css/style.css">

  <style>
    .attribution { font-size: 0.6875rem; text-align: center; padding: 20px 0; }
    .attribution a { color: hsl(228, 45%, 44%); }
  </style>
</head>
<body>

  <header class="header">
    <div class="header-left">
      <!-- Mobile Menu Icon -->
      <img src="images/icon-menu.svg" alt="Menu" class="menu-icon">
      <h2 class="logo">sneakers</h2>
      
      <nav class="nav-links">
        <a href="#catalog" id="nav-collections">Collections</a>
        <a href="#catalog" id="nav-men">Men</a>
        <a href="#catalog" id="nav-women">Women</a>
        <a href="#">About</a>
        <a href="#">Contact</a>
      </nav>
    </div>

    <div class="header-right">
      <div class="cart-container">
        <img src="images/icon-cart.svg" alt="Cart" class="cart-icon">
        
        <span class="cart-badge" style="display: none;">0</span>
        
        <div class="cart-dropdown" style="display: none;">
          <div class="cart-header">
            <p>Cart</p>
          </div>
          <div class="cart-body">
            <p class="empty-msg">Your cart is empty.</p>
            <div class="cart-items">

            </div>
            <button class="checkout-btn" style="display: none;">Checkout</button>
          </div>
        </div>
      </div>
      <img src="images/image-avatar.png" alt="User Avatar" class="avatar">
    </div>
  </header>

  <main class="main-content-new">
    
    <section class="intro-section">
      <h1>Welcome to Sneakers</h1>
      <p>Discover our exclusive collection of premium footwear designed for style and comfort. Find your perfect pair today.</p>
    </section>

    <!-- Product Catalog Section -->
    <section class="product-catalog" id="catalog">
      <div class="catalog-header">
        <h2>Our Collection</h2>
        <div class="search-filter-wrapper">
          <input type="text" id="search-input" placeholder="Search products...">
          <div class="filter-buttons">
            <button class="filter-btn active" data-filter="all">All</button>
            <button class="filter-btn" data-filter="men">Men</button>
            <button class="filter-btn" data-filter="women">Women</button>
          </div>
        </div>
      </div>
      
      <div class="product-grid" id="product-grid"></div>
    </section>

  </main>

  <footer class="attribution">
    <p>All Right Reserved @2026</p>
  </footer>

  <script src="js/script.js"></script>
</body>
</html>
